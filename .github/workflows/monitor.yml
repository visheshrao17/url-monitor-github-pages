name: URL Monitor

on:
  schedule:
    # GitHub Actions cron uses UTC. Runs every five minutes.
    - cron: "*/3 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping runs from racing while updating history.csv.
concurrency:
  group: url-monitor-history
  cancel-in-progress: false

jobs:
  check-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check URLs and append CSV history
        run: python monitor.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.csv
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update URL monitoring history"
            git push origin HEAD:main
          fi
